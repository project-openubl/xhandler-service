quarkus.application.name=xhandler-service

# JSON is snake_case everywhere, like xhandler-rust's models
quarkus.jackson.property-naming-strategy=SNAKE_CASE
# Jackson 3 changed these defaults; the API keeps reading requests as it did with Jackson 2 (a null
# for a primitive is its default value, trailing tokens are ignored)
quarkus.jackson.fail-on-null-for-primitives=false
quarkus.jackson.fail-on-trailing-tokens=false
quarkus.jackson.default-view-inclusion=true
quarkus.jackson.use-getters-as-setters=true

# Rust engine sidecar (same pod, localhost).
# Timeouts nest: app read-timeout > engine's SUNAT timeout (xsender: 120 s), so the app never
# gives up on a send the engine may still complete.
quarkus.rest-client.engine.url=${XHANDLER_ENGINE_URL:http://localhost:8090}
quarkus.rest-client.engine.connect-timeout=2000
quarkus.rest-client.engine.read-timeout=130000

# Let in-flight requests (up to a full SUNAT call) finish on shutdown. The pod's
# terminationGracePeriodSeconds must be larger (deploy/base/deployment.yaml).
quarkus.shutdown.timeout=135s

# Database (Dev Services starts PostgreSQL in dev and test). The app runs as the
# non-owner role xhandler_app so row-level security applies (TenantRlsInterceptor).
quarkus.datasource.db-kind=postgresql
# Own database name: reused Dev Services containers (testcontainers.reuse.enable) of other
# projects with the default name would otherwise be picked up
quarkus.datasource.devservices.db-name=xhandler
quarkus.flyway.migrate-at-start=true
# Production: the app logs in as a non-owner role (DatabaseRoleCheck); migrations use the owner:
#   QUARKUS_FLYWAY_USERNAME / QUARKUS_FLYWAY_PASSWORD, or migrate-at-start=false and a migration job
quarkus.hibernate-orm.database.default-schema=xhandler
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# JSON columns (audit_log.details) use Hibernate's own mapper, not the REST one (snake_case): the
# Quarkus 4 default, so there is nothing to configure

# Identity: Keycloak (OIDC). Dev Services start Keycloak with the dev realm in dev and test.
quarkus.oidc.application-type=service
quarkus.oidc.client-id=xhandler-service
# Only tokens issued for this API (Keycloak audience mapper on each client that calls it)
quarkus.oidc.token.audience=xhandler-service
%dev.quarkus.oidc.credentials.secret=secret
%test.quarkus.oidc.credentials.secret=secret
quarkus.keycloak.devservices.realm-path=../../hack/keycloak/xhandler-realm-dev.json
quarkus.keycloak.devservices.realm-name=xhandler
# Dev mode: Keycloak on the fixed port the UI expects (ui/.env), shared with searchpe's dev mode
# (the first app to start runs the container, the other finds it by its service name)
%dev.quarkus.keycloak.devservices.port=8180
%dev.quarkus.keycloak.devservices.service-name=openubl
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
# Public endpoints (DESIGN.md §12, §15): rate limited at the gateway
quarkus.http.auth.permission.public.paths=/api/v1/status,/api/v1/public/*,/q/openapi,/q/swagger-ui/*,/api/v1/ose/*
quarkus.http.auth.permission.public.policy=permit

# Key vault (DESIGN.md §6): an HSM through PKCS#11 in production
#   xhandler.vault.pkcs11.library, xhandler.vault.pkcs11.pin, xhandler.vault.pkcs11.slot-list-index
xhandler.vault.kind=pkcs11
# Development and tests: software vault with fixed, public master keys. Never in production.
%dev.xhandler.vault.kind=software
%dev.xhandler.vault.software.current-master-key=dev-1
%dev.xhandler.vault.software.master-keys.dev-1=ZGV2LW1hc3Rlci1rZXktMDAwMDAwMDAwMDAwMDAwMDA=
%test.xhandler.vault.kind=software
%test.xhandler.vault.software.current-master-key=test-2
%test.xhandler.vault.software.master-keys.test-1=dGVzdC1tYXN0ZXIta2V5LTEtMDAwMDAwMDAwMDAwMDA=
%test.xhandler.vault.software.master-keys.test-2=dGVzdC1tYXN0ZXIta2V5LTItMDAwMDAwMDAwMDAwMDA=

# Logs: JSON in production (with trace and span ids), plain text in dev and tests
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Observability: OTLP to the collector. In dev mode, opt in to Grafana LGTM from Dev Services with
# -Dquarkus.observability.enabled=true: on the same ports as hack/compose.yaml's lgtm (Grafana
# :3001, OTLP gRPC :4317 and HTTP :4318), so the engine reaches it too. Never in tests.
quarkus.observability.enabled=false
quarkus.observability.lgtm.image-name=docker.io/grafana/otel-lgtm:0.41.0
quarkus.observability.lgtm.grafana-port=3001
quarkus.observability.lgtm.otel-grpc-port=4317
quarkus.observability.lgtm.otel-http-port=4318
quarkus.observability.lgtm.otlp-protocol=grpc
# Production only: LGTM Dev Services refuse to start when the endpoint is set. Dev mode uses the
# Quarkus default (localhost:4317: LGTM, or hack/compose.yaml's lgtm)
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
# Quarkus 4 changed these defaults; kept as they were (DESIGN.md §15): gRPC to :4317, every trace
# sampled, metrics through Micrometer/Prometheus and logs through the console only
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false
%test.quarkus.otel.sdk.disabled=true

# Tests share a few fixed users and a database that outlives the run, so they need room for
# more unverified companies
%test.xhandler.limits.max-unverified-companies=200

# Public URL of the API, for buyer capability links (DESIGN.md §12)
xhandler.public-url=${XHANDLER_PUBLIC_URL:http://localhost:8080}

# Bounded concurrency (DESIGN.md §10.8): emits at once per pod, HSM sessions. An emit holds
# two connections at once (its transaction and the signature log), so the pool must cover
# 2 × emit permits + job slots + headroom; PoolSizeCheck refuses to start otherwise.
xhandler.emit.permits=16
xhandler.emit.permit-timeout=5s
xhandler.emit.lock-timeout=10s
xhandler.hsm.sessions=8
quarkus.datasource.jdbc.max-size=64
quarkus.datasource.jdbc.acquisition-timeout=5s

# Outbound calls to tenant-supplied hosts (webhooks) go through the egress proxy (DESIGN.md §16).
# Private, loopback and link-local destinations are refused unless allowed (development, tests).
#   xhandler.egress.proxy=host:port
# In production the egress proxy is required: it pins DNS, which the in-app check can't.
%dev.xhandler.egress.allow-private=true
%test.xhandler.egress.allow-private=true
%dev.xhandler.egress.require-proxy=false
%test.xhandler.egress.require-proxy=false

# Tests listen on a random free port
quarkus.http.test-port=0

# Role of this process (DESIGN.md §4): api, worker, or all (development and tests)
xhandler.role=all

# Running SUNAT attempts per credential (DESIGN.md §10.2). Production's value is an assumption
# to measure in pilots: SUNAT publishes no per-user limit.
xhandler.jobs.credential-slots.beta=1
xhandler.jobs.credential-slots.production=4
xhandler.jobs.credential-slots.fake=50

# Files (DESIGN.md §13): S3 in production, a local directory in development and tests
#   xhandler.storage.s3.endpoint, .bucket, .region, .access-key, .secret-key
%dev.xhandler.storage.kind=filesystem
%test.xhandler.storage.kind=filesystem
%dev.xhandler.storage.dir=target/files
%test.xhandler.storage.dir=target/test-files

# Tests: a fast job system, and the worker never exits the JVM
%test.xhandler.jobs.poll-interval=200ms
%test.xhandler.jobs.reconcile-interval=200ms
%test.xhandler.jobs.schedule-interval=1s
%test.xhandler.jobs.cleanup-interval=500ms
%test.xhandler.jobs.heartbeat-interval=500ms
%test.xhandler.jobs.worker-ttl=3s
%test.xhandler.jobs.exit-on-lock-loss=false
%test.xhandler.documents.resolve-safety=1s
%test.xhandler.jobs.breaker.base-open=2s
%test.xhandler.jobs.breaker.max-open=4s

# Email (DESIGN.md §11.6, §26.5): the platform sender; quarkus.mailer.host/port/username/password
# point at the platform's provider (SPF, DKIM and DMARC on its domain). Dev mode sends to Mailpit
# (Dev Services; its UI is http://localhost:8080/q/mailpit/); tests mock the mailer.
xhandler.mail.from=Facturación <facturacion@xhandler.local>
%dev.quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true
%test.quarkus.mailpit.enabled=false

# Public lookup by document data (DESIGN.md §12): CAPTCHA verification (hCaptcha or Turnstile)
#   xhandler.captcha.verify-url, xhandler.captcha.secret
%dev.xhandler.captcha.test-mode=true
%test.xhandler.captcha.test-mode=true

# RUC/DNI lookup (DESIGN.md §17): the platform's searchpe, used when a company has no provider
#   xhandler.lookup.searchpe-url=https://searchpe.example/api/{tipo}/{numero}

# Billing (DESIGN.md §14): Lago in its own deployment. Usage events wait in the outbox while it is
# unreachable; entitlements fall back to the free plan after 24 hours without a sync.
#   xhandler.lago.url, xhandler.lago.api-key, xhandler.lago.webhook-secret

# Public API reference (DESIGN.md §26.2): the OpenAPI document and Swagger UI, also in production
quarkus.smallrye-openapi.info-title=xhandler-service API
quarkus.smallrye-openapi.info-version=v1
quarkus.smallrye-openapi.info-description=Comprobantes electrónicos SUNAT: emisión, envío, entrega y consulta.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
# Quarkus 4 no longer adds the local servers by default; the SDKs take their default base URL from them
quarkus.smallrye-openapi.auto-add-server=true
# Bearer JWTs from the OIDC provider: a JWT scheme needs no provider URL at build time (SDK generators require one for openIdConnect)
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearer
quarkus.swagger-ui.always-include=true
# The admin API is for platform operators (xhandler-admin), not part of the public reference or SDKs
mp.openapi.scan.exclude.packages=io.github.projectopenubl.xhandler.resources.admin
# Property names as on the wire (quarkus.jackson.property-naming-strategy=SNAKE_CASE)
mp.openapi.extensions.smallrye.property-naming-strategy=LOWER_CASE_WITH_UNDERSCORES
# Every operation names its operationId (@Operation): stable SDK method names (DESIGN.md §12)
mp.openapi.extensions.smallrye.duplicateOperationIdBehavior=FAIL
# No schemas nothing refers to (e.g. the raw generic Page next to PageDocumentView, ...)
mp.openapi.extensions.smallrye.remove-unused-schemas.enable=true
# Free-form JSON (xbuilder documents, catalog data), not Jackson's node API
mp.openapi.schema.tools.jackson.databind.JsonNode={ "name": "JsonNode", "type": "object", "additionalProperties": true, "description": "JSON libre" }
mp.openapi.schema.tools.jackson.databind.node.ObjectNode={ "name": "ObjectNode", "type": "object", "additionalProperties": true, "description": "Objeto JSON libre" }
# Tenants without a plan yet (new signups) get this one
xhandler.billing.default-plan=free
# Dev mode and tests: no daily quotas, every feature (webhooks) on. Tests share tenants across runs
# (partner tenants in tests get free explicitly)
%dev.xhandler.billing.default-plan=enterprise
%test.xhandler.billing.default-plan=enterprise
%test.xhandler.lago.webhook-secret=lago-test-secret

# OSE role (DESIGN.md §11.4). The RUC the CDR-OSE are issued for; without it the OSE intake answers
# "service unavailable". Forwarding goes to SUNAT's OSE service (given at registration) or the fake.
xhandler.ose.ruc=${XHANDLER_OSE_RUC:}
xhandler.ose.environment=${XHANDLER_OSE_ENVIRONMENT:fake}
%dev.xhandler.ose.ruc=20000000001
%test.xhandler.ose.ruc=20000000001
# SOAP intake carries ZIPs of up to 10 MB in base64 (OseSoapResource, ZipGuard)
quarkus.http.limits.max-body-size=16M
